<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Railline Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas map, one quiet status card top-left, zoom controls bottom-right. */
:root {
  --ground: #15181b;   /* water and everything outside the US */
  --land: #1f2327;
  --ink: #e4eef0;
  --ink-dim: #8d9aa1;
  --accent: #63c5bf;   /* on-time trains, trails */
  --late: #e3a86b;     /* trains running 15+ minutes late */
  --very-late: #e2727c; /* trains running an hour or more late */
  --panel: rgba(30, 35, 39, 0.82);
  --hair: rgba(150, 175, 185, 0.16);
  --font-ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font: 14px/1.4 var(--font-ui); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas.dragging { cursor: grabbing; }
canvas.over-train { cursor: pointer; }

.card {
  position: fixed; background: var(--panel); border: 1px solid var(--hair); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#status {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  padding: 12px 14px; display: grid; gap: 8px; min-width: 210px; max-width: calc(100vw - 32px);
}
#status h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: baseline; gap: 8px; }
#status h1 span { color: var(--ink-dim); font-weight: 400; }
.live { display: flex; align-items: center; gap: 8px; font: 12px var(--font-data); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.4s infinite; flex: none; }
.dot.err { background: var(--late); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99,197,191,.5); } 70% { box-shadow: 0 0 0 7px rgba(99,197,191,0); } 100% { box-shadow: 0 0 0 0 rgba(99,197,191,0); } }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-dim); }
.legend i { display: inline-block; width: 14px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
#msg { font-size: 12px; color: var(--late); max-width: 260px; }

#tip {
  padding: 10px 12px; pointer-events: none; display: grid; gap: 4px; min-width: 190px; max-width: 260px;
  transform: translate(14px, 14px);
}
.late b.d { color: var(--late); }
.vlate b.d { color: var(--very-late); }
.ok b.d { color: var(--accent); }
.rows { display: grid; gap: 4px; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink-dim); }
.row b { font: 500 12px var(--font-data); color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.ttl { font-weight: 600; font-size: 14px; }
.ttl .n { color: var(--ink-dim); font-weight: 400; }

#info {
  left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 270px; max-width: calc(100vw - 100px); padding: 12px 14px; display: grid; gap: 10px;
}
#info .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#info .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
#info .ttl { font-size: 16px; }
#info .route { font-size: 12px; color: var(--ink-dim); }
.bar { height: 3px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
#info button { justify-self: start; background: none; border: 1px solid var(--hair); color: var(--ink); border-radius: 6px; padding: 4px 10px; font: 12px var(--font-ui); cursor: pointer; }
#info button:hover { background: rgba(255,255,255,.05); }
#info button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#stip { padding: 5px 9px; pointer-events: none; font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
#stip span { color: var(--ink-dim); font: 11px var(--font-data); margin-left: 6px; }

#zoom {
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; overflow: hidden;
}
#zoom button {
  width: 38px; height: 38px; border: 0; background: transparent; color: var(--ink); font: 400 20px var(--font-ui); cursor: pointer;
}
#zoom button + button { border-top: 1px solid var(--hair); }
#zoom button:hover { background: rgba(255,255,255,.05); }
#zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.credit { position: fixed; right: max(66px, calc(env(safe-area-inset-right, 0px) + 66px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: #5c686f; }
.credit a { color: inherit; }
.credit { max-width: calc(100vw - 380px); text-align: right; }
@media (max-width: 520px) { .credit { display: none; } #status { min-width: 0; } #info { width: auto; right: 70px; } }
</style>
</head>
<body>
<canvas id="map" aria-label="Map of passenger trains across the United States"></canvas>

<div id="status" class="card">
  <h1>Railline <span>live</span></h1>
  <div class="live"><span class="dot" id="dot"></span><span id="count">Connecting to train feed…</span></div>
  <div class="legend"><span><i style="background:var(--accent)"></i>On time</span><span><i style="background:var(--late)"></i>15+ min late</span><span><i style="background:var(--very-late)"></i>1+ hr late</span></div>
  <div id="msg" hidden></div>
</div>
<div id="tip" class="card" hidden></div>
<div id="stip" class="card" hidden></div>
<div id="info" class="card" hidden aria-live="polite">
  <div class="head"><span class="eyebrow">Following</span><span class="eyebrow" id="infoPct"></span></div>
  <div><div class="ttl" id="infoTitle"></div><div class="route" id="infoRoute"></div></div>
  <div class="bar"><i id="infoBar"></i></div>
  <div class="rows" id="infoRows"></div>
  <button id="unfollow" type="button">Stop following</button>
</div>
<div id="zoom" class="card">
  <button id="zin" type="button" aria-label="Zoom in">+</button>
  <button id="zout" type="button" aria-label="Zoom out">−</button>
</div>
<div class="credit">Positions: <a href="https://amtraker.com" target="_blank" rel="noopener">Amtraker</a> · Track: FRA · Terrain: AWS Terrain Tiles · Streets: <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Natural Earth</div>

<script>
/*__GEO__*/
</script>
<script>
(() => {
'use strict';
const API = 'https://api.amtraker.com/v3';
const POLL_MS = 30000;
const MPH = 1.609344 / 3600; // mph -> km/s

// ---------- projection (must match the build step) ----------
const R = 6371, rad = Math.PI / 180;
const P1 = 29.5 * rad, P2 = 45.5 * rad, L0 = -96 * rad, F0 = 37.5 * rad;
const N = (Math.sin(P1) + Math.sin(P2)) / 2, C = Math.cos(P1) ** 2 + 2 * N * Math.sin(P1);
const RHO0 = Math.sqrt(C - 2 * N * Math.sin(F0)) / N;
function project(lon, lat) {
  const t = N * (lon * rad - L0), r = Math.sqrt(C - 2 * N * Math.sin(lat * rad)) / N;
  return [R * r * Math.sin(t), -R * (RHO0 - r * Math.cos(t))];
}

function unproject(x, y) {
  const X = x / R, Y = -y / R, rho = Math.sign(N) * Math.hypot(X, RHO0 - Y), th = Math.atan2(X, RHO0 - Y);
  return [(L0 + th / N) / rad, Math.asin(Math.max(-1, Math.min(1, (C - rho * rho * N * N) / (2 * N)))) / rad];
}

// ---------- decode embedded geometry ----------
const Q = GEO.q;
function dec(arr) {
  const out = new Float32Array(arr.length); let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; out[i] = x * Q; out[i + 1] = y * Q; }
  return out;
}
function toPath(lines, close) {
  const p = new Path2D();
  for (const l of lines) {
    const a = dec(l); p.moveTo(a[0], a[1]);
    for (let i = 2; i < a.length; i += 2) p.lineTo(a[i], a[i + 1]);
    if (close) p.closePath();
  }
  return p;
}
// A line layer keeps one whole-country path for far zooms, plus small bounded chunks so close
// zooms only stroke what is on screen (stroking the whole country at street scale is very slow).
const CHUNK = 40;
function toLayer(polylines) {
  const all = new Path2D(), chunks = [];
  for (const a of polylines) {
    all.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) all.lineTo(a[i], a[i + 1]);
    for (let st = 0; st < a.length - 2; st += CHUNK * 2) {
      const end = Math.min(a.length, st + CHUNK * 2 + 2), p = new Path2D();
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let i = st; i < end; i += 2) {
        const x = a[i], y = a[i + 1]; i === st ? p.moveTo(x, y) : p.lineTo(x, y);
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      chunks.push({ p, a: a.subarray(st, end), x0, y0, x1, y1 });
    }
  }
  return { all, chunks };
}
const layers = {
  land: toPath(GEO.land, true), coast: toLayer(GEO.coast.map(dec)), borders: toLayer(GEO.borders.map(dec)),
  roadsMajor: toLayer(GEO.roadsMajor.map(dec)), roadsMinor: toLayer(GEO.roadsMinor.map(dec)),
  riversMajor: toLayer(GEO.riversMajor.map(dec)), riversMinor: toLayer(GEO.riversMinor.map(dec)),
  lakes: toPath(GEO.lakes, true),
};

// Track graph
const nodes = GEO.nodes.map(([x, y]) => [x * Q, y * Q]);
const edges = GEO.edges.map(([a, b, d]) => {
  const pts = dec(d); let len = 0;
  for (let i = 2; i < pts.length; i += 2) len += Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
  return { a, b, pts, len };
});
const adj = nodes.map(() => []);
edges.forEach((e, i) => { adj[e.a].push([i, e.b]); adj[e.b].push([i, e.a]); });
layers.track = toLayer(edges.map(e => e.pts));

// Liang–Barsky: parametric [t0, t1] of a segment inside a rectangle, or null
function clipSeg(ax, ay, bx, by, x0, y0, x1, y1) {
  let t0 = 0, t1 = 1; const dx = bx - ax, dy = by - ay;
  const P = [-dx, dx, -dy, dy], Qv = [ax - x0, x1 - ax, ay - y0, y1 - ay];
  for (let i = 0; i < 4; i++) {
    if (P[i] === 0) { if (Qv[i] < 0) return null; continue; }
    const r = Qv[i] / P[i];
    if (P[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; } else { if (r < t0) return null; if (r < t1) t1 = r; }
  }
  return [t0, t1];
}

// US-only filter: a train is drawn only while its reported position is on US land (or within
// a few km of the coast/border, so lakeshore and coastal running isn't dropped)
const hitCtx = document.createElement('canvas').getContext('2d');
const landOutline = toPath(GEO.coast);
function inUS(x, y) {
  if (hitCtx.isPointInPath(layers.land, x, y, 'evenodd')) return true;
  hitCtx.lineWidth = 6; return hitCtx.isPointInStroke(landOutline, x, y);
}

// Stations: code -> {node, x, y}; node -1 means off the embedded network
const stations = {};
for (const [code, [node, x, y]] of Object.entries(GEO.stations)) stations[code] = { node, x: x * Q, y: y * Q };
const ST_ABBR = { Alabama: 'AL', Arizona: 'AZ', Arkansas: 'AR', California: 'CA', Colorado: 'CO', Connecticut: 'CT', Delaware: 'DE', 'District of Columbia': 'DC', Florida: 'FL', Georgia: 'GA', Idaho: 'ID', Illinois: 'IL', Indiana: 'IN', Iowa: 'IA', Kansas: 'KS', Kentucky: 'KY', Louisiana: 'LA', Maine: 'ME', Maryland: 'MD', Massachusetts: 'MA', Michigan: 'MI', Minnesota: 'MN', Mississippi: 'MS', Missouri: 'MO', Montana: 'MT', Nebraska: 'NE', Nevada: 'NV', 'New Hampshire': 'NH', 'New Jersey': 'NJ', 'New Mexico': 'NM', 'New York': 'NY', 'North Carolina': 'NC', 'North Dakota': 'ND', Ohio: 'OH', Oklahoma: 'OK', Oregon: 'OR', Pennsylvania: 'PA', 'Rhode Island': 'RI', 'South Carolina': 'SC', 'South Dakota': 'SD', Tennessee: 'TN', Texas: 'TX', Utah: 'UT', Vermont: 'VT', Virginia: 'VA', Washington: 'WA', 'West Virginia': 'WV', Wisconsin: 'WI', Wyoming: 'WY' };
// Stations drawn as dots: the rail stations from the embedded FRA list
const stationDots = Object.entries(GEO.stationNames).filter(([c]) => stations[c]).map(([code, name]) => {
  const m = name.match(/^(.*),\s*([^,]+)$/);
  return { code, x: stations[code].x, y: stations[code].y, name: m && ST_ABBR[m[2].trim()] ? `${m[1]}, ${ST_ABBR[m[2].trim()]}` : name };
});

// ---------- routing ----------
function dijkstra(src, dst) {
  if (src === dst) return [];
  const dist = new Float64Array(nodes.length).fill(Infinity), prev = new Int32Array(nodes.length).fill(-1), prevE = new Int32Array(nodes.length);
  const heap = [[0, src]]; dist[src] = 0;
  const push = (it) => { heap.push(it); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  while (heap.length) {
    const [d, u] = pop(); if (d > dist[u]) continue; if (u === dst) break;
    for (const [ei, v] of adj[u]) { const nd = d + edges[ei].len; if (nd < dist[v]) { dist[v] = nd; prev[v] = u; prevE[v] = ei; push([nd, v]); } }
  }
  if (!isFinite(dist[dst])) return null;
  const seq = []; for (let v = dst; v !== src; v = prev[v]) seq.push([prevE[v], prev[v]]);
  return { steps: seq.reverse(), len: dist[dst] };
}

const routeCache = new Map();
function buildRoute(codes) {
  const key = codes.join('>');
  if (routeCache.has(key)) return routeCache.get(key);
  const xs = [], ys = [];
  const add = (x, y) => { const n = xs.length; if (n && Math.abs(xs[n - 1] - x) < 1e-4 && Math.abs(ys[n - 1] - y) < 1e-4) return; xs.push(x); ys.push(y); };
  const stops = [];
  for (let i = 0; i < codes.length; i++) {
    const s = stations[codes[i]];
    if (i === 0) { add(s.x, s.y); stops.push(0); continue; }
    const a = stations[codes[i - 1]], b = s;
    const straight = Math.hypot(b.x - a.x, b.y - a.y);
    const path = a.node >= 0 && b.node >= 0 ? dijkstra(a.node, b.node) : null;
    if (path && path.len < straight * 2.2 + 40) {
      for (const [ei, from] of path.steps) {
        const p = edges[ei].pts, fwd = edges[ei].a === from;
        if (fwd) for (let k = 0; k < p.length; k += 2) add(p[k], p[k + 1]);
        else for (let k = p.length - 2; k >= 0; k -= 2) add(p[k], p[k + 1]);
      }
    }
    add(b.x, b.y);
    stops.push(xs.length - 1);
  }
  const n = xs.length, cum = new Float64Array(n);
  for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]);
  const r = { xs: Float64Array.from(xs), ys: Float64Array.from(ys), cum, total: cum[n - 1] || 0, stopS: stops.map(i => cum[i]) };
  routeCache.set(key, r);
  return r;
}
function seg(r, s) { // index i with cum[i] <= s < cum[i+1]
  let lo = 0, hi = r.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (r.cum[m] <= s) lo = m; else hi = m; }
  return lo;
}
function pointAt(r, s, out) {
  s = Math.max(0, Math.min(r.total, s));
  const i = seg(r, s), L = r.cum[i + 1] - r.cum[i];
  const t = L > 0 ? (s - r.cum[i]) / L : 0;
  out[0] = r.xs[i] + (r.xs[i + 1] - r.xs[i]) * t; out[1] = r.ys[i] + (r.ys[i + 1] - r.ys[i]) * t;
  return out;
}
function locate(r, x, y, hint) { // nearest arc-length on route; prefers the window around hint
  const scan = (lo, hi) => {
    let best = { d: Infinity, s: 0 };
    for (let i = lo; i < hi; i++) {
      const ax = r.xs[i], ay = r.ys[i], dx = r.xs[i + 1] - ax, dy = r.ys[i + 1] - ay, L2 = dx * dx + dy * dy;
      const t = L2 > 0 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L2)) : 0;
      const d = Math.hypot(ax + dx * t - x, ay + dy * t - y);
      if (d < best.d) best = { d, s: r.cum[i] + Math.sqrt(L2) * t };
    }
    return best;
  };
  const n = r.xs.length - 1;
  if (hint != null) {
    const w = scan(seg(r, Math.max(0, hint - 120)), Math.min(n, seg(r, hint + 120) + 1));
    if (w.d < 6) return w;
  }
  return scan(0, n);
}

// ---------- consist estimates (cars including locomotives) ----------
const CONSIST = [
  [/acela/i, 8, 'both'], [/auto train/i, 28, 'double'], [/empire builder|coast starlight|lake shore|silver meteor|silver star|floridian/i, 11, 'double'],
  [/zephyr|southwest chief|capitol limited|crescent/i, 10, 'double'], [/sunset|city of new orleans|texas eagle|cardinal/i, 8, 'double'],
  [/northeast regional|regional/i, 8, 'cab'], [/palmetto|carolinian|keystone|pennsylvanian|vermonter|cascades|surfliner/i, 7, 'cab'],
  [/piedmont|heartland|mardi gras|hartford|valley flyer|berkshire/i, 4, 'cab'], [/brightline/i, 7, 'both'],
];
function consistFor(name) {
  for (const [re, n, kind] of CONSIST) if (re.test(name)) return { n, kind };
  return { n: 6, kind: 'cab' };
}

// ---------- train state ----------
const trains = new Map(); // trainID -> state
let lastFetchOk = 0, stationsFetched = false;

const LATE_MIN = 15, VERY_LATE_MIN = 60;
const tier = (late) => late >= VERY_LATE_MIN ? 'vlate' : late >= LATE_MIN ? 'late' : 'ok';
function parseTime(s) { const t = Date.parse(s); return isFinite(t) ? t : NaN; }
function lateness(t) {
  const next = t.stations.find(s => s.status === 'Enroute') || t.stations.filter(s => s.status === 'Departed').pop();
  if (!next) return 0;
  const a = parseTime(next.arr || next.dep), b = parseTime(next.schArr || next.schDep);
  return isFinite(a) && isFinite(b) ? Math.round((a - b) / 60000) : 0;
}

async function fetchMissingStations(codes) {
  if (stationsFetched || !codes.length) return;
  stationsFetched = true;
  try {
    const res = await fetch(API + '/stations'); if (!res.ok) return;
    const all = await res.json();
    for (const [code, m] of Object.entries(all)) {
      if (stations[code] || !isFinite(m.lat) || !isFinite(m.lon)) continue;
      const [x, y] = project(m.lon, m.lat); stations[code] = { node: -1, x, y };
    }
    routeCache.clear();
  } catch (_) { /* positions still work for stations we already know */ }
}

function ingest(data, fetchedAt) {
  const seen = new Set(), missing = new Set();
  for (const list of Object.values(data)) for (const t of list) {
    if (t.trainState !== 'Active' || !isFinite(t.lat) || !isFinite(t.lon)) continue;
    if (/via/i.test(t.provider || '') || /via/i.test(t.providerShort || '')) continue;
    const [x, y] = project(t.lon, t.lat);
    if (!inUS(x, y)) continue;
    const stops = (t.stations || []).filter(s => !s.bus);
    stops.forEach(s => { if (!stations[s.code]) missing.add(s.code); });
    const knownStops = stops.filter(s => stations[s.code]), known = knownStops.map(s => s.code);
    if (known.length < 2) continue;
    const route = buildRoute(known);
    if (route.total < 1) continue;
    let ts = parseTime(t.lastValTS);
    if (!isFinite(ts) || ts > fetchedAt + 60000 || ts < fetchedAt - 30 * 60000) ts = fetchedAt;
    const id = t.trainID || (t.routeName + t.trainNum);
    let st = trains.get(id);
    const hint = st && st.route === route ? st.sDisp : null;
    const loc = locate(route, x, y, hint);
    if (loc.d > 60) continue; // position nowhere near its scheduled route
    const v = Math.max(0, (+t.velocity || 0) * MPH);
    if (!st || st.route !== route) {
      const now = Date.now(), s0 = Math.min(route.total, loc.s + v * Math.min(180, (now - ts) / 1000));
      st = { id, route, sDisp: s0, vDisp: v, born: performance.now(), alpha: 0, pinged: new Set() };
      route.stopS.forEach((ss, k) => { if (ss <= s0 + 0.1) st.pinged.add(k); }); // no pings for stops already behind it
      trains.set(id, st);
    }
    // The model won't carry a train past the next stop it hasn't reached yet; it eases in and waits
    const nextIdx = knownStops.findIndex(s => s.status === 'Enroute');

// Soft effects: the trail behind the train and its glow. Drawn clipped to the US outline.
function drawTrainFx(c, t) {
  const r = t.route, a = t.alpha, rgb = rgbFor(t), G = trainGeom(t), { s, far, near, wPx, trainKm } = G, head = t.sDisp;
  const trailPx = 70 + 110 * far, trailKm = Math.min(trailPx / s, 400);
  const tail0 = head - trainKm, steps = 22, trailA = (0.25 + 0.55 * far) * a;
  if (tail0 > 0 && trailA > 0.02) {
    c.lineCap = 'round';
    for (let k = 0; k < steps; k++) {
      const f0 = k / steps, f1 = (k + 1) / steps;
      const s0 = tail0 - trailKm * (1 - f0), s1 = tail0 - trailKm * (1 - f1);
      if (s1 <= 0) continue;
      pointAt(r, Math.max(0, s0), tmpA); pointAt(r, s1, tmpB);
      const p0 = toScreen(tmpA[0], tmpA[1]), p1 = toScreen(tmpB[0], tmpB[1]);
      const e = f1 * f1;
      c.strokeStyle = `rgba(${rgb},${(trailA * e * 0.1).toFixed(3)})`; c.lineWidth = wPx * 3.2 * (0.4 + 0.6 * f1);
      c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      c.strokeStyle = `rgba(${rgb},${(trailA * e).toFixed(3)})`; c.lineWidth = Math.max(1, wPx * 0.55 * (0.3 + 0.7 * f1));
      c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
    }
  }
  // Wide, faint glow: a pre-rendered falloff sprite, centered mid-train
  pointAt(r, Math.max(0, head - trainKm / 2), tmpB);
  const gp = toScreen(tmpB[0], tmpB[1]), gr = Math.min(Math.max(70 + 40 * near, trainKm * s * 0.6), 260);
  c.globalAlpha = (0.55 + 0.45 * far) * a * 0.42;
  c.drawImage(glowSprite(rgb), gp[0] - gr, gp[1] - gr, gr * 2, gr * 2);
  c.globalAlpha = 1;
}

function drawTrain(c, t) {
  const r = t.route, a = t.alpha, rgb = rgbFor(t), sel = follow === t.id || hovered === t;
  const { s, wPx, carKm, gapKm } = trainGeom(t), head = t.sDisp, n = t.consist.n;

  // Route ahead for the selected train
  if (sel) {
    c.save(); c.strokeStyle = `rgba(${rgb},0.35)`; c.lineWidth = 1.2; c.setLineDash([2, 5]);
    c.beginPath();
    pointAt(r, head, tmpA); let q = toScreen(tmpA[0], tmpA[1]);
    const reach = head + Math.hypot(W, H) / s * 1.2;
    for (let i = seg(r, head) + 1; i < r.xs.length; i++) {
      const p = toScreen(r.xs[i], r.ys[i]), cl = clipSeg(q[0], q[1], p[0], p[1], -20, -20, W + 20, H + 20);
      if (cl) { const dx = p[0] - q[0], dy = p[1] - q[1]; c.moveTo(q[0] + dx * cl[0], q[1] + dy * cl[0]); c.lineTo(q[0] + dx * cl[1], q[1] + dy * cl[1]); }
      q = p; if (r.cum[i] > reach) break;
    }
    c.stroke(); c.restore();
  }

  pointAt(r, head, tmpA);
  const hp = toScreen(tmpA[0], tmpA[1]), hitPts = [hp[0], hp[1]];
  // Cars as rounded rectangles laid along the track, each on its own chord so the train bends
  const kind = t.consist.kind;
  for (let i = 0; i < n; i++) {
    const sa = head - i * (carKm + gapKm), sb = sa - carKm;
    if (sa <= 0) break;
    pointAt(r, sa, tmpA); pointAt(r, Math.max(0, sb), tmpB);
    const pa = toScreen(tmpA[0], tmpA[1]), pb = toScreen(tmpB[0], tmpB[1]);
    hitPts.push(pb[0], pb[1]);
    const len = Math.hypot(pa[0] - pb[0], pa[1] - pb[1]); if (len < 0.5) continue;
    const ang = Math.atan2(pa[1] - pb[1], pa[0] - pb[0]);
    const loco = i === 0 || ((kind === 'both') && i === n - 1) || (kind === 'double' && i === 1);
    c.save();
    c.translate((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2); c.rotate(ang);
    c.globalAlpha = a;
    c.fillStyle = loco ? `rgb(${rgb})` : COL.car;
    c.beginPath(); roundRect(c, -len / 2, -wPx / 2, len, wPx, Math.min(wPx * 0.45, i === 0 ? wPx : wPx * 0.35)); c.fill();
    if (sel) { c.strokeStyle = `rgba(${rgb},0.9)`; c.lineWidth = 1; c.stroke(); }
    c.restore();
  }
  hits.set(t.id, { pts: hitPts, w: wPx, reach: 14 });
}

// Arrival pings: two thin rings that spread out from the station and fade
const PING_MS = 2600;
function drawPings(c, now) {
  for (let i = pings.length - 1; i >= 0; i--) if (now - pings[i].t0 > PING_MS + 600) pings.splice(i, 1);
  c.lineWidth = 1.2;
  for (const pg of pings) {
    const p = toScreen(pg.x, pg.y);
    if (p[0] < -200 || p[1] < -200 || p[0] > W + 200 || p[1] > H + 200) continue;
    for (const delay of [0, 500]) {
      const k = (now - pg.t0 - delay) / PING_MS; if (k < 0 || k > 1) continue;
      const e = 1 - (1 - k) ** 3, r = 4 + 130 * e, al = 0.38 * (1 - k) ** 2;
      c.strokeStyle = `rgba(${pg.rgb},${al.toFixed(3)})`;
      c.beginPath(); c.arc(p[0], p[1], r, 0, Math.PI * 2); c.stroke();
    }
    const k0 = (now - pg.t0) / 900;
    if (k0 < 1) { c.fillStyle = `rgba(${pg.rgb},${(0.5 * (1 - k0)).toFixed(3)})`; c.beginPath(); c.arc(p[0], p[1], 3.5, 0, Math.PI * 2); c.fill(); }
  }
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  stepTrains(dt);
  if (follow) {
    const t = trains.get(follow);
    if (!t) setFollow(null);
    else { pointAt(t.route, t.sDisp, tmpA); view.x += (tmpA[0] - view.x) * Math.min(1, dt * 4); view.y += (tmpA[1] - view.y) * Math.min(1, dt * 4); if (goal.active) { goal.ax = view.x; goal.ay = view.y; goal.sx = W / 2; goal.sy = H / 2; } }
  }
  applyZoom(Math.min(1, dt * 9));
  let ox = (view.x - baseView.x) * view.s, oy = (view.y - baseView.y) * view.s;
  if (baseDirty || view.s !== baseView.s || Math.abs(ox) > MARGIN - 2 || Math.abs(oy) > MARGIN - 2) { drawBase(); ox = oy = 0; }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(base, Math.round((MARGIN + ox) * DPR), Math.round((MARGIN + oy) * DPR), canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
  hits.clear();
  const pad = 400 / view.s + 50;
  const [vx0, vy0] = toWorld(0, 0), [vx1, vy1] = toWorld(W, H);
  const order = [...trains.values()].sort((a, b) => (a === hovered || a.id === follow) - (b === hovered || b.id === follow)).filter(t => {
    pointAt(t.route, t.sDisp, tmpA);
    return !(tmpA[0] < vx0 - pad || tmpA[0] > vx1 + pad || tmpA[1] < vy0 - pad || tmpA[1] > vy1 + pad);
  });
  // Glows, trails and pings never spill past the US outline. Clipping costs a full-screen pass, so
  // it's skipped when no stretch of outline is near the view (the view is then all land or all water).
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gm = 300 / view.s, outlineNear = layers.coast.chunks.some(ch => ch.x1 >= vx0 - gm && ch.x0 <= vx1 + gm && ch.y1 >= vy0 - gm && ch.y0 <= vy1 + gm);
  if (outlineNear || !inUS(view.x, view.y)) {
    ctx.setTransform(view.s * DPR, 0, 0, view.s * DPR, (W / 2 - view.x * view.s) * DPR, (H / 2 - view.y * view.s) * DPR);
    ctx.clip(layers.land, 'evenodd');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  for (const t of order) drawTrainFx(ctx, t);
  drawPings(ctx, now);
  ctx.restore();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const t of order) drawTrain(ctx, t);
  if (hoveredStation) {
    const p = toScreen(hoveredStation.x, hoveredStation.y);
    ctx.strokeStyle = 'rgba(228,238,240,0.7)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, Math.PI * 2); ctx.stroke();
  }
  // Re-check hover every frame: trains move under a still cursor, and the map moves while following
  if (mouseIn) hover(mouse[0], mouse[1]);
  renderInfo(now);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
poll();
})();
</script>
</body>
</html>
